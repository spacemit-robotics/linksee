schema_version: 3
device:
    arm:
        driver: mujoco_ur5e
        device_id: grasp_arm
        resource_id: perceptive_grasp_simulation
        options: {mapping_file: mapping.yaml}
        tolerance_rad: 0.008
        timeout_s: 30
        joints:
            - {name: robot_shoulder_pan_joint, minimum_rad: -6.2831, maximum_rad: 6.2831}
            - {name: robot_shoulder_lift_joint, minimum_rad: -6.2831, maximum_rad: 6.2831}
            - {name: robot_elbow_joint, minimum_rad: -3.1415, maximum_rad: 3.1415}
            - {name: robot_wrist_1_joint, minimum_rad: -6.2831, maximum_rad: 6.2831}
            - {name: robot_wrist_2_joint, minimum_rad: -6.2831, maximum_rad: 6.2831}
            - {name: robot_wrist_3_joint, minimum_rad: -6.2831, maximum_rad: 6.2831}
    effector:
        driver: mujoco_robotiq_2f85
        device_id: grasp_gripper
        resource_id: perceptive_grasp_simulation
        options: {mapping_file: mapping.yaml}
        channels: [gripper]
        feedback: position
        tolerance: 0.03
        timeout_s: 5.0
steps: []
