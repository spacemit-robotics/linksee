# perceptive_grasp pc mujoco service configuration
# The server provides rgb-d frames and physical ur5e execution.

mujoco_server:
  listen: "127.0.0.1"
  port: 9090

camera:
  type: "mujoco"
  mujoco:
    xml_path: "../simulation/mujoco/ur5e_scene.xml"
    camera_name: "realsense"
    width: 640
    height: 480
    depth:
      min_m: 0.05
      max_m: 3.0

detection:
  config_path: yolov8_seg.yaml
  target_labels: []
  min_confidence: 0.10
  min_area: 1000
  stable_frames: 3
  allow_color_only_fallback: true
  refine_with_simulation_colors: true
  # Synthetic rendering can differ from the model's training domain.
  label_remap:
    "sports ball": "apple"
    "umbrella": "banana"
    "book": "cube"
  # Refine synthetic instance masks after yolo classification. The same
  # colors also provide an explicit fallback when yolo misses a scene object.
  simulation_color_targets:
    - {label: apple, hsv_min: [0, 100, 80], hsv_max: [10, 255, 255], min_area: 80, max_area: 15000}
    - {label: apple, hsv_min: [170, 80, 60], hsv_max: [179, 255, 255], min_area: 80, max_area: 15000}
    - {label: banana, hsv_min: [15, 100, 80], hsv_max: [38, 255, 255], min_area: 120, max_area: 20000}
    - {label: cup, hsv_min: [112, 140, 30], hsv_max: [130, 255, 255], min_area: 100, max_area: 30000}
    - {label: cube, hsv_min: [140, 100, 60], hsv_max: [175, 255, 255], min_area: 80, max_area: 10000}

calibration:
  mujoco:
    T_base_camera:
      translation: [-0.020684, 0.043910, 0.300747]
      rotation: [-2.088074, 0.015059, -1.529363]

grasp:
  strategy: "auto"
  top:
    approach_height: 0.25
    grasp_depth: 0.020
    gripper_offset: 0.0
    grasp_point_x_ratio: 0.0
    position_source: "projected_geometry_center"
    safe_mask_interior: true
    support_plane_occlusion_recovery: true
    support_plane_height_anchor: true
    projected_center_blend: 1.0
    sparse_projected_center_blend: 0.3
    minimum_grasp_height: 0.045
    gripper_open: 0.6
  side:
    min_height_m: 0.140
    min_height_width_ratio: 1.2
    approach_distance_m: 0.100
    entry_clearance_m: 0.180
    pregrasp_min_x_m: 0.270
    single_sided_gripper: false
    gripper_offset_m: 0.0
    # Move the reconstructed visible surface toward the estimated volume center.
    visible_surface_offset_m: 0.025
    grasp_forward_offset_m: 0.0
    grasp_height_ratio: 0.95
    initial_lift_m: 0.050
    lift_retreat_m: 0.025
  gripper_effort: 0.8
  gripper_hold_load_threshold: 100.0
  gripper_empty_position_margin: 0.03
  gripper_timeout_ms: 3000
  geometry:
    sample_stride: 2
    max_object_points: 4000
    min_object_points: 80
    plane_distance_threshold_m: 0.008
    table_clearance_m: 0.040
    footprint_padding_m: 0.005
    gripper_max_width_m: 0.10
    planning_timeout_ms: 750
    perception_budget_ms: 500
  workspace:
    x_min: 0.0
    x_max: 1.1
    y_min: -0.6
    y_max: 0.6
    z_min: 0.0
    z_max: 0.5

orientation:
  enabled: true
  aspect_ratio_threshold: 1.2

manipulator:
  driver: "mujoco_ur5e"
  legacy_top_ik: false
  home_joints: [-1.5708, -1.5708, 1.5708, -1.5708, -1.5708, 0.0]
  observe_joints: [-1.5708, -1.5708, 1.5708, -1.5708, -1.5708, 0.0]
  side_ready_joints: [0.20, -0.90, 1.30, -1.80, -1.57, 0.0]
  joint_limits:
    - {joint: 0, min: -6.28, max: 6.28}
    - {joint: 1, min: -6.28, max: 6.28}
    - {joint: 2, min: -6.28, max: 6.28}
    - {joint: 3, min: -6.28, max: 6.28}
    - {joint: 4, min: -6.28, max: 6.28}
    - {joint: 5, min: -6.28, max: 6.28}
  move_speed: 0.6
  line_speed: 0.5
  mujoco:
    xml_path: "../simulation/mujoco/ur5e_scene.xml"
    end_effector_site: "robot_gripper_pinch"
    gripper_actuator: "robot_gripper_fingers_actuator"
    robot_root_body: "robot_base"
    gripper_root_body: "robot_gripper_base_mount"
    joint_names:
      - "robot_shoulder_pan_joint"
      - "robot_shoulder_lift_joint"
      - "robot_elbow_joint"
      - "robot_wrist_1_joint"
      - "robot_wrist_2_joint"
      - "robot_wrist_3_joint"
    actuator_names:
      - "robot_shoulder_pan"
      - "robot_shoulder_lift"
      - "robot_elbow"
      - "robot_wrist_1"
      - "robot_wrist_2"
      - "robot_wrist_3"
    gripper_open_ctrl: 0.0
    gripper_close_ctrl: 255.0
    gravity_compensation: true
    arm_stiffness_scale: 12.0
    joint_tolerance_rad: 0.04
    ik_position_tolerance_m: 0.006
    cartesian_tracking_tolerance_m: 0.003
    ik_step_scale: 0.80
    ik_damping: 0.010
    ik_iterations: 300
    settle_steps: 500
    max_motion_steps: 4000

place:
  place_joints: [-1.20, -1.00, 1.40, -1.90, -1.57, 0.0]
  release_open: 0.5

mobile_base:
  enabled: false

voice:
  trigger_words: ["抓", "拿", "pick", "grab"]
  cancel_words: ["停止", "停", "取消", "stop", "cancel"]
  home_words: ["结束", "待命", "回家", "home"]
