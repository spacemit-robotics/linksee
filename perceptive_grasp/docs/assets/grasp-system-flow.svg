<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="540" viewBox="0 0 1260 540" role="img" aria-labelledby="title desc">
  <title id="title">perceptive grasp pipeline 链路</title>
  <desc id="desc">立体相机提供彩色图和深度信息，spacemit_vision_service 完成目标分割，pipeline 状态机根据目标 mask 和深度信息生成顶抓或侧抓位姿，linksee 机械臂执行抓取和放置。asr 输入抓取命令，pipeline 通过 tts 播报状态。目标超出舒适抓取区时，底盘辅助对齐，停车后重新感知和规划。</desc>

  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#059669"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#0f766e"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .heading { font-family: Arial, 'Noto Sans CJK SC', sans-serif; font-size: 17px; font-weight: 700; fill: #0f172a; }
      .node-title { font-family: Arial, 'Noto Sans CJK SC', sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .body { font-family: Arial, 'Noto Sans CJK SC', sans-serif; font-size: 13px; fill: #475569; }
      .caption { font-family: Arial, 'Noto Sans CJK SC', sans-serif; font-size: 12px; font-weight: 600; fill: #64748b; }
      .small-title { font-family: Arial, 'Noto Sans CJK SC', sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .small-text { font-family: Arial, 'Noto Sans CJK SC', sans-serif; font-size: 11px; fill: #64748b; }
      .step { font-family: Arial, 'Noto Sans CJK SC', sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
      .arrow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="540" fill="#ffffff"/>

  <!-- Voice interaction -->
  <text x="790" y="18" text-anchor="middle" class="caption">语音交互</text>
  <g filter="url(#shadow)">
    <rect x="675" y="28" width="105" height="70" rx="8" fill="#f8fafc" stroke="#bfdbfe"/>
    <rect x="800" y="28" width="105" height="70" rx="8" fill="#f8fafc" stroke="#bbf7d0"/>
  </g>

  <!-- asr microphone icon -->
  <g transform="translate(714 39)" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="1" width="10" height="18" rx="5"/>
    <path d="M4 14a9 9 0 0 0 18 0M13 23v4M9 27h8"/>
  </g>
  <text x="727" y="88" text-anchor="middle" class="small-title">asr</text>

  <!-- tts speaker icon -->
  <g transform="translate(836 43)" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 8v10h7l8 6V2L8 8H1z"/>
    <path d="M21 8a8 8 0 0 1 0 10M25 4a13 13 0 0 1 0 18"/>
  </g>
  <text x="852" y="88" text-anchor="middle" class="small-title">tts</text>

  <path class="arrow" d="M727 110V117" stroke="#2563eb"/>
  <path d="M727 123l-6-10h12z" fill="#2563eb"/>
  <path class="arrow" d="M852 123V116" stroke="#059669"/>
  <path d="M852 110l-6 10h12z" fill="#059669"/>
  <text x="712" y="116" text-anchor="end" class="small-text">抓取命令</text>
  <text x="867" y="116" text-anchor="start" class="small-text">状态播报</text>

  <!-- Stage panels -->
  <g filter="url(#shadow)">
    <rect x="30" y="135" width="215" height="240" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <rect x="330" y="135" width="250" height="240" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
    <rect x="665" y="135" width="250" height="240" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="1000" y="135" width="230" height="240" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/>
  </g>

  <!-- Panel headers -->
  <path d="M38 135H237a8 8 0 0 1 8 8v40H30v-40a8 8 0 0 1 8-8z" fill="#f8fafc"/>
  <path d="M338 135H572a8 8 0 0 1 8 8v40H330v-40a8 8 0 0 1 8-8z" fill="#f0fdf4"/>
  <path d="M673 135H907a8 8 0 0 1 8 8v40H665v-40a8 8 0 0 1 8-8z" fill="#eff6ff"/>
  <path d="M1008 135H1222a8 8 0 0 1 8 8v40H1000v-40a8 8 0 0 1 8-8z" fill="#fff7ed"/>
  <line x1="30" y1="183" x2="245" y2="183" stroke="#cbd5e1"/>
  <line x1="330" y1="183" x2="580" y2="183" stroke="#bbf7d0"/>
  <line x1="665" y1="183" x2="915" y2="183" stroke="#bfdbfe"/>
  <line x1="1000" y1="183" x2="1230" y2="183" stroke="#fed7aa"/>

  <!-- Step labels -->
  <circle cx="55" cy="159" r="12" fill="#64748b"/>
  <circle cx="355" cy="159" r="12" fill="#15803d"/>
  <circle cx="690" cy="159" r="12" fill="#2563eb"/>
  <circle cx="1025" cy="159" r="12" fill="#c2410c"/>
  <text x="55" y="163" text-anchor="middle" class="step">01</text>
  <text x="355" y="163" text-anchor="middle" class="step">02</text>
  <text x="690" y="163" text-anchor="middle" class="step">03</text>
  <text x="1025" y="163" text-anchor="middle" class="step">04</text>
  <text x="137" y="165" text-anchor="middle" class="heading">感知输入</text>
  <text x="455" y="165" text-anchor="middle" class="heading">目标感知</text>
  <text x="790" y="165" text-anchor="middle" class="heading">pipeline 状态机</text>
  <text x="1115" y="165" text-anchor="middle" class="heading">机械臂执行</text>

  <!-- Input node -->
  <rect x="50" y="205" width="175" height="140" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <g transform="translate(105 222)" fill="none" stroke="#475569" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="8" width="66" height="38" rx="6"/>
    <circle cx="23" cy="27" r="9"/>
    <circle cx="48" cy="27" r="9"/>
    <path d="M10 8l6-8h34l6 8M12 51h42"/>
  </g>
  <text x="137" y="300" text-anchor="middle" class="node-title">立体相机</text>
  <text x="137" y="325" text-anchor="middle" class="body">彩色图 + 深度信息</text>

  <!-- Vision node -->
  <rect x="350" y="205" width="210" height="140" rx="8" fill="#f7fef8" stroke="#86efac"/>
  <g transform="translate(424 218)" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="62" height="50" rx="5"/>
    <path d="M8 17V8h11M43 8h11v9M54 33v9H43M19 42H8v-9"/>
    <path d="M22 19h19v17H22z" fill="#bbf7d0" stroke="none"/>
    <circle cx="31" cy="27" r="4" fill="#15803d" stroke="none"/>
  </g>
  <text x="455" y="295" text-anchor="middle" class="node-title">yolov8-seg</text>
  <text x="455" y="319" text-anchor="middle" class="body">类别 / 检测框 / mask</text>

  <!-- Planning node -->
  <rect x="685" y="205" width="210" height="140" rx="8" fill="#f8fbff" stroke="#93c5fd"/>
  <g transform="translate(758 217)" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="26" r="23"/>
    <circle cx="32" cy="26" r="8"/>
    <path d="M32 0v12M32 40v12M6 26h12M46 26h12"/>
    <circle cx="32" cy="26" r="3" fill="#2563eb" stroke="none"/>
  </g>
  <text x="790" y="295" text-anchor="middle" class="node-title">抓取定位与规划</text>
  <text x="790" y="319" text-anchor="middle" class="body">深度定位 / 顶抓与侧抓</text>

  <!-- Arm execution node -->
  <rect x="1020" y="205" width="190" height="140" rx="8" fill="#fffaf5" stroke="#fdba74"/>
  <g transform="translate(1078 216)" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 54h62M14 54v-8h18v8M23 46V29l18-14 14 12"/>
    <circle cx="23" cy="29" r="5" fill="#ffedd5"/>
    <circle cx="41" cy="15" r="5" fill="#ffedd5"/>
    <circle cx="55" cy="27" r="5" fill="#ffedd5"/>
    <path d="M59 29l10 5M59 29l8-7"/>
  </g>
  <text x="1115" y="295" text-anchor="middle" class="node-title">linksee 机械臂</text>
  <text x="1115" y="319" text-anchor="middle" class="body">抓取 / 抬升 / 放置</text>

  <!-- Main data flow -->
  <path class="arrow" d="M257 270H308" stroke="#334155"/>
  <path d="M318 270l-10-6v12z" fill="#334155"/>
  <path class="arrow" d="M592 270H643" stroke="#334155"/>
  <path d="M653 270l-10-6v12z" fill="#334155"/>
  <path class="arrow" d="M927 270H978" stroke="#334155"/>
  <path d="M988 270l-10-6v12z" fill="#334155"/>
  <text x="288" y="251" text-anchor="middle" class="caption">彩色 + 深度</text>
  <text x="623" y="251" text-anchor="middle" class="caption">mask + 深度</text>
  <text x="958" y="251" text-anchor="middle" class="caption">抓取位姿</text>

  <!-- Chassis alignment loop -->
  <g filter="url(#shadow)">
    <rect x="665" y="435" width="250" height="75" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  </g>
  <g transform="translate(693 453)" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="54" height="28" rx="6"/>
    <path d="M10 0l8-9h18l8 9M12 28v7M42 28v7"/>
    <circle cx="12" cy="35" r="5" fill="#ccfbf1"/>
    <circle cx="42" cy="35" r="5" fill="#ccfbf1"/>
  </g>
  <text x="825" y="464" text-anchor="middle" class="node-title">底盘辅助对齐</text>
  <text x="825" y="488" text-anchor="middle" class="body">前后移动 / 原地转向</text>

  <path class="arrow" d="M790 387V413" stroke="#0f766e"/>
  <path d="M790 423l-6-10h12z" fill="#0f766e"/>
  <text x="922" y="408" text-anchor="end" class="caption">目标超出舒适抓取区</text>
  <path class="arrow" d="M653 472H137V397" stroke="#0f766e"/>
  <path d="M137 387l-6 10h12z" fill="#0f766e"/>
  <text x="395" y="496" text-anchor="middle" class="caption">停车后重新感知与规划</text>
</svg>
