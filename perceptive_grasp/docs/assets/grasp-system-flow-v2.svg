  <text x="140" y="358" text-anchor="middle" class="body">spacemit_las2 双目相机</text>

  <!-- Detection -->
  <g transform="translate(410 220)" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="70" height="56" rx="5"/>
    <path d="M8 18V8h12M50 8h12v10M62 38v10H50M20 48H8V38"/>
    <path d="M24 21h22v20H24z" fill="#bbf7d0" stroke="none"/>
    <circle cx="35" cy="31" r="5" fill="#15803d" stroke="none"/>
  </g>
  <text x="445" y="310" text-anchor="middle" class="node-title">yolov8-seg</text>
  <text x="445" y="335" text-anchor="middle" class="body">类别 / 检测框 / mask</text>
  <text x="445" y="358" text-anchor="middle" class="body">实例关联 + 目标稳定性判断</text>

  <!-- Geometry -->
  <g transform="translate(706 216)" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round">
    <path d="M0 58H88"/>
    <circle cx="16" cy="42" r="3" fill="#14b8a6" stroke="none"/>
    <circle cx="26" cy="29" r="3" fill="#14b8a6" stroke="none"/>
    <circle cx="37" cy="20" r="3" fill="#0f766e" stroke="none"/>
    <circle cx="49" cy="18" r="3" fill="#0f766e" stroke="none"/>
    <circle cx="61" cy="25" r="3" fill="#14b8a6" stroke="none"/>
    <circle cx="72" cy="39" r="3" fill="#14b8a6" stroke="none"/>
    <path d="M13 46C28 13 61 10 76 44"/>
    <path d="M44 8v44M35 17l9-9 9 9"/>
  </g>
  <text x="750" y="310" text-anchor="middle" class="node-title">目标点云 + 桌面平面</text>
  <text x="750" y="335" text-anchor="middle" class="body">长 / 宽 / 高 + 水平主轴</text>
  <text x="750" y="358" text-anchor="middle" class="body">顶抓 / 侧抓候选</text>

  <!-- Closed-loop planning -->
  <g transform="translate(1008 216)" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="38" cy="30" r="26"/>
    <circle cx="38" cy="30" r="8"/>
    <path d="M38 0v15M38 45v15M8 30h15M53 30h15"/>
    <path d="M72 11h22v16M94 27l-7-7M94 27l-7 7"/>
  </g>
  <text x="1055" y="310" text-anchor="middle" class="node-title">策略锁定与安全规划</text>
  <text x="1055" y="335" text-anchor="middle" class="body">观察 / 底盘动作后重感知</text>
  <text x="1055" y="358" text-anchor="middle" class="body">工作空间 / IK / 完整路径</text>
  <text x="1055" y="381" text-anchor="middle" class="body">执行失败 → RECOVERING</text>

