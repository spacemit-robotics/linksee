    <path d="M11 0l8-9h20l8 9M13 30v8M45 30v8"/>
    <circle cx="13" cy="38" r="5" fill="#ccfbf1"/>
    <circle cx="45" cy="38" r="5" fill="#ccfbf1"/>
  </g>
  <text x="1085" y="518" text-anchor="middle" class="node-title">底盘辅助对齐</text>
  <text x="1085" y="543" text-anchor="middle" class="body">短距离移动 / 停车</text>

