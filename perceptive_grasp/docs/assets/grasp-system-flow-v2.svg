  <path d="M343 150H547a8 8 0 0 1 8 8v40H335v-40a8 8 0 0 1 8-8z" fill="#f0fdf4"/>
  <path d="M648 150H852a8 8 0 0 1 8 8v40H640v-40a8 8 0 0 1 8-8z" fill="#f0fdfa"/>
  <path d="M953 150H1157a8 8 0 0 1 8 8v40H945v-40a8 8 0 0 1 8-8z" fill="#eff6ff"/>
  <path d="M1258 150H1462a8 8 0 0 1 8 8v40H1250v-40a8 8 0 0 1 8-8z" fill="#fff7ed"/>
