  <path class="arrow" d="M262 280H315" stroke="#334155"/>
  <path d="M325 280l-10-6v12z" fill="#334155"/>
  <path class="arrow" d="M567 280H620" stroke="#334155"/>
  <path d="M630 280l-10-6v12z" fill="#334155"/>
  <path class="arrow" d="M872 280H925" stroke="#334155"/>
  <path d="M935 280l-10-6v12z" fill="#334155"/>
  <path class="arrow" d="M1177 280H1230" stroke="#334155"/>
  <path d="M1240 280l-10-6v12z" fill="#334155"/>
