  <line x1="945" y1="198" x2="1165" y2="198" stroke="#bfdbfe"/>
  <line x1="1250" y1="198" x2="1470" y2="198" stroke="#fed7aa"/>

  <!-- Header labels -->
  <circle cx="53" cy="174" r="11" fill="#64748b"/>
  <circle cx="358" cy="174" r="11" fill="#15803d"/>
  <circle cx="663" cy="174" r="11" fill="#0f766e"/>
  <circle cx="968" cy="174" r="11" fill="#2563eb"/>
  <circle cx="1273" cy="174" r="11" fill="#c2410c"/>
