<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
  <title id="title">perceptive_grasp 真机抓取链路</title>
  <desc id="desc">RealSense D435i 或 spacemit_las2 立体相机提供彩色图、对齐深度和相机内参。yolov8-seg 检测并分割目标，pipeline 关联目标实例并判断目标稳定性，再估计目标点云、桌面平面和三维尺寸。任务状态机锁定顶抓或侧抓策略，在观察位或底盘动作后重新感知，并验证工作空间、逆运动学和完整路径。Linksee SO101 完成接近、抓取、抬升、放置、归位和恢复动作。</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .heading { font-family: Arial, 'Noto Sans CJK SC', sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .node-title { font-family: Arial, 'Noto Sans CJK SC', sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .body { font-family: Arial, 'Noto Sans CJK SC', sans-serif; font-size: 12px; fill: #475569; }
      .caption { font-family: Arial, 'Noto Sans CJK SC', sans-serif; font-size: 11px; font-weight: 600; fill: #64748b; }
      .flow-label { font-family: Arial, 'Noto Sans CJK SC', sans-serif; font-size: 10px; font-weight: 600; fill: #64748b; }
      .small-title { font-family: Arial, 'Noto Sans CJK SC', sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .step { font-family: Arial, 'Noto Sans CJK SC', sans-serif; font-size: 10px; font-weight: 700; fill: #ffffff; }
      .arrow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1500" height="620" fill="#ffffff"/>

  <!-- Voice interaction -->
  <text x="1055" y="18" text-anchor="middle" class="caption">可选语音交互</text>
  <g filter="url(#shadow)">
    <rect x="950" y="30" width="95" height="70" rx="8" fill="#f8fafc" stroke="#bfdbfe"/>
    <rect x="1065" y="30" width="95" height="70" rx="8" fill="#f8fafc" stroke="#bbf7d0"/>
  </g>
  <g transform="translate(981 40)" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="1" width="10" height="18" rx="5"/>
    <path d="M4 14a9 9 0 0 0 18 0M13 23v4M9 27h8"/>
  </g>
  <text x="997" y="89" text-anchor="middle" class="small-title">ASR</text>
  <g transform="translate(1094 42)" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 8v10h7l8 6V2L8 8H1z"/>
    <path d="M21 8a8 8 0 0 1 0 10M25 4a13 13 0 0 1 0 18"/>
  </g>
  <text x="1112" y="89" text-anchor="middle" class="small-title">TTS</text>
  <path class="arrow" d="M997 108V132" stroke="#2563eb"/>
  <path d="M997 142l-6-10h12z" fill="#2563eb"/>
  <path class="arrow" d="M1112 142V116" stroke="#059669"/>
  <path d="M1112 106l-6 10h12z" fill="#059669"/>
  <text x="983" y="121" text-anchor="end" class="caption">命令</text>
  <text x="1126" y="121" text-anchor="start" class="caption">状态</text>

  <!-- Main stage panels -->
  <g filter="url(#shadow)">
    <rect x="30" y="150" width="220" height="260" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <rect x="335" y="150" width="220" height="260" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
    <rect x="640" y="150" width="220" height="260" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="945" y="150" width="220" height="260" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="1250" y="150" width="220" height="260" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/>
  </g>

