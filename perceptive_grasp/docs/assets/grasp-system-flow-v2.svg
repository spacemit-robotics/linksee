    <circle cx="40" cy="16" r="5" fill="#ffedd5"/>
    <circle cx="56" cy="29" r="5" fill="#ffedd5"/>
    <path d="M60 31l10 5M60 31l8-8"/>
  </g>
  <text x="1360" y="310" text-anchor="middle" class="node-title">Linksee SO101</text>
  <text x="1360" y="334" text-anchor="middle" class="body">接近 / 抓取 / 抬升 / 放置</text>
  <text x="1360" y="357" text-anchor="middle" class="body">归位 / 恢复动作</text>

