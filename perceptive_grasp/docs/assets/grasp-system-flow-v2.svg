  <text x="597" y="258" text-anchor="middle" class="flow-label">mask + 深度</text>
  <text x="902" y="258" text-anchor="middle" class="flow-label">抓取候选</text>
  <text x="1207" y="258" text-anchor="middle" class="flow-label">安全路径</text>

  <!-- Execution recovery loop -->
  <path class="arrow" d="M1360 422V458H1130V422" stroke="#c2410c"/>
  <path d="M1130 412l-6 12h12z" fill="#c2410c"/>
  <text x="1245" y="452" text-anchor="middle" class="caption">动作结果 / 持物状态 / 执行错误</text>

  <!-- Chassis alignment loop -->
  <g filter="url(#shadow)">
    <rect x="945" y="485" width="220" height="85" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  </g>
  <g transform="translate(965 507)" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
