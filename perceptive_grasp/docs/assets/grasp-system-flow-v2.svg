  <text x="663" y="178" text-anchor="middle" class="step">03</text>
  <text x="968" y="178" text-anchor="middle" class="step">04</text>
  <text x="1273" y="178" text-anchor="middle" class="step">05</text>
  <text x="140" y="180" text-anchor="middle" class="heading">感知输入</text>
  <text x="445" y="180" text-anchor="middle" class="heading">检测与关联</text>
  <text x="750" y="180" text-anchor="middle" class="heading">几何与候选</text>
